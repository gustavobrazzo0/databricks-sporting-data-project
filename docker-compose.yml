services:
  minio:
    image: minio/minio:latest
    container_name: cairn-bolt-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    container_name: cairn-bolt-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb -p local/cairn-bolt-lakehouse/landing;
      mc mb -p local/cairn-bolt-lakehouse/processed;
      mc mb -p local/cairn-bolt-lakehouse/bronze;
      mc mb -p local/cairn-bolt-lakehouse/silver;
      mc mb -p local/cairn-bolt-lakehouse/gold;
      exit 0;
      "

  spark:
    build:
      context: ./docker
    container_name: cairn-bolt-spark
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./spark:/home/jovyan/work/spark
      - ./data:/home/jovyan/work/data
    depends_on:
      - minio
